<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceartee - Bienvenido</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Ventana.css">

  <link rel="stylesheet" href="transiciones.css">
<script src="transiciones.js"></script>
  <style>
    .perfil-activo-info {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px;
      border: 2px solid rgba(102,126,234,0.3);
      animation: fadeIn 0.6s ease;
    }
    .perfil-avatar-grande { font-size: 64px; margin-bottom: 8px; }
    .perfil-nombre-grande { font-size: 22px; font-weight: 700; color: white; margin-bottom: 16px; }
    .btn-cambiar-perfil {
      background: transparent; border: 2px solid rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.8); padding: 10px 24px;
      border-radius: 25px; cursor: pointer; font-family: 'Poppins', sans-serif;
      font-size: 14px; transition: all 0.3s;
    }
    .btn-cambiar-perfil:hover { border-color: #667eea; color: #667eea; transform: translateY(-2px); }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>


<body>

  <!-- 1. Overlay PRIMERO -->
  <div class="ceartee-fade-overlay" id="ceartee-fade"></div>
  
  <div class="bg-animation">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>
  <div class="container" id="main-container">
    <div class="logo">
      <img src="./assets/Imagenes/Logo_de_Ceartee.jfif" alt="CEARTEE" onerror="this.style.display='none'" style="max-width:150px; border-radius:20px;">
    </div>
    <h1 class="title" data-i18n="bienvenida">Bienvenido a Ceartee</h1>
    <p class="subtitle" data-i18n="subtitulo">Tu experiencia comienza aquí</p>
    <div id="area-accion" style="width:100%; display:flex; flex-direction:column; align-items:center;">
      <button class="btn-enter" id="btnEnter" data-i18n="iniciar">Pulsa para Entrar</button>
    </div>
    <div class="decoration"><span></span><span></span><span></span></div>
  </div>
  <script src="perfiles.js"></script>
  <script src="Inicio.js"></script>
  <script src="aplicar-config.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var areaAccion = document.getElementById('area-accion');
      var btnEnter = document.getElementById('btnEnter');
      if (window.PerfilesManager) {
        var perfil = window.PerfilesManager.obtenerPerfilActivo();
        var perfiles = window.PerfilesManager.obtenerPerfiles();
        if (perfil) {
          areaAccion.innerHTML = '';
          var infoDiv = document.createElement('div');
          infoDiv.className = 'perfil-activo-info';
          infoDiv.innerHTML = `
            <div class="perfil-avatar-grande">${perfil.avatar}</div>
            <div class="perfil-nombre-grande">¡Hola, ${perfil.nombre}!</div>
            <button class="btn-enter" id="btnContinuar" style="margin-bottom:12px;">▶ Continuar</button>
            <br>
            <button class="btn-cambiar-perfil" id="btnCambiarPerfil">👥 Cambiar jugador</button>
          `;
          areaAccion.appendChild(infoDiv);
          document.getElementById('btnContinuar').addEventListener('click', function() {
  cearteeNavigate('Etapas.html');
});
          document.getElementById('btnCambiarPerfil').addEventListener('click', function() {
            window.PerfilesManager.logout();
            mostrarSelectorPerfiles();
          });
        } else if (perfiles.length > 0) {
          mostrarSelectorPerfiles();
        } else {
          mostrarSelectorPerfiles();
        }
      }
      function mostrarSelectorPerfiles() {
        areaAccion.style.display = 'none';
        document.querySelector('.decoration').style.display = 'none';
        var selectorContainer = document.createElement('div');
        selectorContainer.id = 'selector-perfiles-container';
        selectorContainer.style.width = '100%';
        document.getElementById('main-container').appendChild(selectorContainer);
        window.renderPantallaPerfiles('selector-perfiles-container', function(perfilId) {
          window.location.reload();
        });
      }
    });
  </script>
</body>
</html>
